name: Build Windows Executable

on:
  push:
    branches: [ master ]
    paths:
      - 'pc/**'
      - 'requirements.txt'
      - '.github/workflows/build-windows-exe.yml'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: Build executable with PyInstaller
      timeout-minutes: 15
      run: |
        cd pc
        pyinstaller --onefile ^
          --windowed ^
          --name cpcview ^
          --add-data "cpcterm.py:." ^
          --add-data "m4term.py:." ^
          --hidden-import=customtkinter ^
          --hidden-import=PIL ^
          cpcview.py
      shell: cmd

    - name: Verify build output
      run: |
        if exist "pc\dist\cpcview.exe" (
          echo Build successful - cpcview.exe created
          dir pc\dist\cpcview.exe
        ) else (
          echo ERROR: cpcview.exe not found
          exit /b 1
        )
      shell: cmd

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create ${{ github.ref_name }} pc/dist/cpcview.exe `
          --title "cpcview ${{ github.ref_name }}" `
          --generate-notes
      shell: pwsh

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: cpcview-windows
        path: pc/dist/cpcview.exe
